# The den.yaml of runbook-sources.tape. The tape copies it to /tmp and adds a
# source to the copy, so this file stays as it is. Placeholder environments,
# no services and no updates block: a recording connects nothing.
version: "1"

aws:                                # no real profiles in a recording
  config_path: /dev/null
  credentials_path: /dev/null

menu_order: [runbooks, help]        # only what the demo shows

environments:                       # placeholder names: no account is ever called
  demo-prod:
    region: eu
    environment: prod
    aws_profile: orders-prod
    aws_region_code: eu-central-1
    ec2_instance_id: i-0123456789abcdef0

runbooks:
  dirs: [mine]                      # your own runbooks; den runbook fork copies into it
