# den.yaml of drafts.tape: only what this demo shows. Placeholder environments, no
# services, no updates. The tape copies it to /tmp/den-drafts-demo, next to a copy of
# one demo runbook and a den built there, and runs den inside that folder, where it
# finds this file as ./den.yaml; nothing in the repository changes:
#
#   cd /tmp/den-drafts-demo && den
version: "1"

aws:
  config_path: /dev/null
  credentials_path: /dev/null

menu_order: [runbooks, help]

environments:
  demo-e2e:
    region: eu
    environment: e2e
    aws_profile: orders-e2e
    aws_region_code: eu-central-1
    ec2_instance_id: i-0123456789abcdef0

runbooks:
  dirs: [runbooks]                  # the copy of the demo runbook, next to this file
  agent: claude                     # n asks what the agent should write; nothing is sent
  drafts:
    keep_request: until-exit        # a request goes once its agent exits cleanly
    days: 30                        # untouched drafts are kept a month
  defaults:
    history: 5
