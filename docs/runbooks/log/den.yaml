# The den.yaml of runbook-log.tape: one runbook whose run prints a log long
# enough to search, with colours and a few warnings. Placeholder environment and
# no services, so a recording connects nothing and calls no AWS. Run it from the
# repository root:
#
#   den -c docs/runbooks/log/den.yaml
version: "1"

aws:                                # no real profiles in a recording
  config_path: /dev/null
  credentials_path: /dev/null

menu_order: [runbooks, help]        # only what the demo shows

environments:                       # placeholder names: no account is ever called
  demo-e2e:
    region: eu
    environment: e2e
    aws_profile: orders-e2e
    aws_region_code: eu-central-1
    ec2_instance_id: i-0123456789abcdef0

runbooks:
  items:
    - name: Migrate orders
      description: Applies the orders schema migrations; a long log with a few warnings
      env: demo-e2e
      command: |
        i=1
        while [ "$i" -le 40 ]; do
          printf '\033[32m✔\033[0m migration %03d applied to orders in %d ms\n' "$i" $((i * 37 % 90 + 10))
          if [ $((i % 13)) -eq 0 ]; then
            printf '\033[33mWARN\033[0m migration %03d held a lock on orders_items for 2s\n' "$i"
          fi
          i=$((i + 1))
          sleep 0.05
        done
        printf '\033[33mWARN\033[0m 3 rows of orders_archive skipped: no customer_id\n'
        echo "done: 40 migrations applied to $AWS_PROFILE"
