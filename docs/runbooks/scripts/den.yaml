# The den.yaml of runbook-scripts.tape, which copies it into /tmp/den-scripts-demo
# with two header scripts: moving one into a folder there leaves the repository
# alone. Placeholder environments and no services, so a recording connects
# nothing; without an updates block the update check only asks GHE.
version: "1"

aws:                                # no real profiles in a recording
  config_path: /dev/null
  credentials_path: /dev/null

menu_order: [runbooks, help]        # only what the demo shows

environments:                       # placeholder names: no account is ever called
  demo-e2e:
    region: eu
    environment: e2e
    aws_profile: orders-e2e
    aws_region_code: eu-central-1
    ec2_instance_id: i-0123456789abcdef0

runbooks:
  dirs: [scripts]                   # /tmp/den-scripts-demo/scripts, once copied: loose scripts, no folders
