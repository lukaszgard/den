# The den.yaml of secrets-git.tape: one SOPS file in a git working copy, which
# docs/secrets/demo/git-demo.sh makes in /tmp/den-secrets-git with a local bare
# repository as its remote, and one file outside any repository. A teammate's clone
# has pushed a rotated password that yours has not fetched. Fake values, encrypted to
# the demo age key; no AWS and no network. Run from the repository root:
#
#   make tape TAPE=secrets-git
version: "1"

aws:                                # no real profiles in a recording
  config_path: /dev/null
  credentials_path: /dev/null

menu_order: [secrets, help]         # only what the demo shows

secrets:
  sops:
    - name: payments dev
      description: in the infra repository a teammate pushes to
      file: /tmp/den-secrets-git/infra/secrets/payments-dev.enc.yaml
      # no git: block: den finds the repository, the branch and its upstream

    - name: local env
      description: in no repository, so no git status
      file: /tmp/den-secrets-git/local.enc.yaml
