# The den.yaml of secrets.tape, which copies docs/secrets/demo into /tmp/den-secrets-demo:
# a throwaway SOPS file (age key included), a KeePassXC database whose master
# password is "demo", and a Vault dev server that docs/secrets/demo/vault-demo.sh
# starts on 127.0.0.1:18200 (root token "demo", exported as VAULT_TOKEN). Fake values
# only, no AWS and no real secret: editing the file in a recording changes the copy,
# never the repository. Paths are absolute because den expands only ~ in them. Run
# from the repository root:
#
#   make tape TAPE=secrets
#
# docs/secrets/demo/make-fixtures.sh makes the files again.
version: "1"

aws:                                # no real profiles in a recording
  config_path: /dev/null
  credentials_path: /dev/null

menu_order: [secrets, help]         # only what the demo shows

secrets:
  sops:
    - name: Demo
      description: age-encrypted demo file
      file: /tmp/den-secrets-demo/demo.enc.yaml

  keepassxc:
    - name: Team vault
      description: KeePassXC demo database, master password "demo"
      database: /tmp/den-secrets-demo/team.kdbx
      remember_password: 10m        # the pane's details box shows it as a toggle

  vault:
    - name: Grafana admin
      description: One secret of a Vault dev server, token from VAULT_TOKEN
      address: http://127.0.0.1:18200
      path: grafana/admin
      login: vault login -method=token   # what L would run; the demo already has a token

    - name: AMS apps
      description: Every secret under a folder, to pick from
      address: http://127.0.0.1:18200
      path: apps/ams/
