name: Release index

# releases.json lists every release for den's version picker and update check
# (scripts/release-index.sh builds it). It lives on the latest stable release,
# so it reads at releases/latest/download/releases.json with no API call, like
# latest.json. Rebuilt after every release (release.yaml calls this: a release
# made with GITHUB_TOKEN fires no release event), when .github/yanked.json
# changes on main (a yank or an unyank), and by hand.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/yanked.json]

permissions:
  contents: write

# Two rebuilds at once would race to upload; the later one has the newer list.
concurrency:
  group: release-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      # main's yanked.json, also when a tag push called this: a yank merged
      # after the tagged commit must still hold.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Build releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-index.sh "${{ github.repository }}" .github/yanked.json > releases.json

      # gh release view without a tag is the latest release, which is never a
      # prerelease: a release candidate's index goes to the stable one before it.
      - name: Upload it to the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          gh release upload "$tag" releases.json --repo "${{ github.repository }}" --clobber
          echo "releases.json ($(jq '.releases | length' releases.json) releases) uploaded to $tag" >> "$GITHUB_STEP_SUMMARY"
