name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          path: "repo"
          fetch-depth: 0
          # The tagged commit, not whatever main points to by the time this runs:
          # a PR merged after the tag must not ship under the tag's version.
          ref: ${{ github.ref }}

      # The notes on the release page and in latest.json (shown by the Updates
      # pane) are this tag's CHANGELOG.md section, not GoReleaser's commit list:
      # PRs are squash-merged, so that list is a few PR titles. A tag without a
      # section fails here, before anything is published.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' repo/CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section; add one before tagging"
            exit 1
          fi

      # The same setup-go as CI, so both install the toolchain go.mod names.
      - uses: actions/setup-go@v7
        with:
          go-version-file: repo/go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          version: "v2.15"
          args: release --clean --release-notes ${{ github.workspace }}/release-notes.md
          workdir: "repo"

      # latest.json is what an S3 mirror's Updates check and the install scripts'
      # latest lookup read. It goes up after the archives and before the scripts
      # on purpose: a script that is published must never point at a release
      # that is not uploaded yet.
      - name: Publish latest.json, CHANGELOG.md and the install scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n \
            --arg version "${{ github.ref_name }}" \
            --rawfile notes release-notes.md \
            '{"version":$version,"notes":$notes}' > latest.json
          gh release upload "${{ github.ref_name }}" latest.json --repo "${{ github.repository }}" --clobber
          gh release upload "${{ github.ref_name }}" repo/CHANGELOG.md repo/scripts/install.sh repo/scripts/install.ps1 \
            --repo "${{ github.repository }}" --clobber

  # releases.json, the list the version picker reads, goes up once the release
  # is published: it names this release too.
  index:
    needs: release
    uses: ./.github/workflows/release-index.yaml
